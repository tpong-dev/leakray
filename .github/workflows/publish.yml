# One-time PyPI Trusted Publisher setup (no API token needed):
#   1. On pypi.org go to your project (or "Publishing" -> "Add a pending publisher" for a new project).
#   2. Add a GitHub publisher with:
#        Owner:       tpong-dev
#        Repository:  leakray
#        Workflow:    publish.yml
#        Environment: pypi
#   3. In GitHub: Settings -> Environments -> create an environment named "pypi".
name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
