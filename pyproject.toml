[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leakray"
version = "0.1.0"
description = "Static analysis that finds data leakage in ML code: Python scripts and Jupyter notebooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "tpong-dev" }]
keywords = ["machine-learning", "data-leakage", "static-analysis", "linter", "jupyter", "scikit-learn", "sarif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "nbformat>=5.7",
  "rich>=13.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
leakray = "leakray.cli:main"

[project.urls]
Homepage = "https://github.com/tpong-dev/leakray"
Documentation = "https://tpong-dev.github.io/leakray/"
Issues = "https://github.com/tpong-dev/leakray/issues"
Changelog = "https://github.com/tpong-dev/leakray/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/leakray"]

[tool.hatch.build.targets.sdist]
include = ["src/leakray", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["fixtures", ".*", "build", "dist"]

[tool.coverage.run]
source = ["leakray"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/fixtures", "benchmark/cases", "benchmark/holdout"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "SIM102", "SIM103", "SIM105", "B905", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/leakray"]
ignore_missing_imports = true
warn_unused_ignores = false
